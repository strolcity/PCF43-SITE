<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCF 43 - Accueil</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/tT0MFfbS/pcf43.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url("https://i.postimg.cc/k4rpWZCs/mezenc.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .logos {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
        }

        .logos a {
            display: block;
        }

        .logos img {
            height: 80px;
            transition: all 0.3s ease;
        }

        .logos a:first-child img {
            animation: bounce 2s infinite;
        }
        .logos a:first-child:hover img {
            animation: none;
            transform: scale(1.1);
        }

        .logos a:last-child img {
            transition: transform 0.5s ease;
        }
        .logos a:last-child:hover img {
            transform: rotate(15deg) scale(1.1);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin: 20px 0 40px;
        }

        /* Animation pour "PCF 43" */
        .pcf-title {
            display: inline-block;
            animation: colorPulse 2s infinite alternate;
            cursor: pointer;
        }

        @keyframes colorPulse {
            0% { color: #d32f2f; }
            50% { color: #ffeb3b; }
            100% { color: #d32f2f; }
        }

        .btn-urne {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
            gap: 12px;
            margin-bottom: 40px;
        }

        .btn-urne img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #d32f2f;
            background: rgba(0,0,0,0.45);
            padding: 10px;
            object-fit: contain;
            transition: transform 0.6s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .btn-urne:hover img {
            transform: rotate(360deg);
            box-shadow: 0 0 25px rgba(211,47,47,0.8);
        }

        .btn-urne span {
            font-size: 1.1em;
            background: #d32f2f;
            padding: 8px 22px;
            border-radius: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            transition: background 0.3s;
        }

        .btn-urne:hover span {
            background: #b71c1c;
        }

        .logos-bottom {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: auto;
        }

        .logos-bottom a {
            display: block;
        }

        .logos-bottom img {
            height: 70px;
            transition: all 0.3s ease;
        }

        .logos-bottom a:first-child:hover img {
            transform: scale(1.1) rotate(-10deg);
        }

        .logos-bottom a:last-child:hover img {
            transform: scale(1.1) rotate(10deg);
        }

        /* Style pour la pop-up */
        #pcf-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.95);
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            color: white;
            text-align: left;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
        }

        #pcf-popup h2 {
            margin-top: 0;
            color: #ffeb3b;
            text-align: center;
            border-bottom: 1px solid #d32f2f;
            padding-bottom: 10px;
        }

        #pcf-popup p {
            margin: 10px 0;
            line-height: 1.6;
        }

        #pcf-popup .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: white;
            background: none;
            border: none;
        }
    </style>
</head>
<body>
    <div class="logos">
        <a href="https://abonnement.humanite.fr/" target="_blank">
            <img src="https://i.postimg.cc/KjnNN342/l-umanite.png" alt="L'Humanité">
        </a>
        <a href="https://www.pcf.fr/" target="_blank">
            <img src="https://i.postimg.cc/7hgVVJbx/pcf.png" alt="PCF">
        </a>
    </div>

    <h1>Bienvenue sur le site du <span class="pcf-title" onclick="openPcfPopup()">PCF 43</span></h1>

    <a href="analyse.html" class="btn-urne">
        <img src="https://i.postimg.cc/DZVM1DhN/urne.png" alt="Urne électorale">
        <span>Analyse Électorale →</span>
    </a>

    <div class="logos-bottom">
        <a href="https://groupe-communiste.assemblee-nationale.fr/" target="_blank">
            <img src="https://i.postimg.cc/QCpbbKVD/les-deputes.png" alt="Députés">
        </a>
        <a href="https://senateurscrce.fr/" target="_blank">
            <img src="https://i.postimg.cc/1XpHHV4P/Senateur.png" alt="Sénateur">
        </a>
    </div>

    <!-- Pop-up PCF 43 -->
    <div id="pcf-popup">
        <button class="close-btn" onclick="closePcfPopup()">×</button>
        <h2>Fédération HAUTE-LOIRE</h2>
        <p><strong>Adresse :</strong><br>52 av Maréchal Foch</p>
        <p><strong>Code Postal :</strong><br>43000</p>
        <p><strong>Ville :</strong><br>Le Puy-en-Velay</p>
        <p><strong>Téléphone :</strong><br>04 71 09 22 56</p>
        <p><strong>Courriel :</strong><br>pcf43@orange.fr</p>
    </div>

    <!-- Pop-up Deezer -->
    <div id="deezer-popup" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; background: rgba(0,0,0,0.9); padding: 20px; border-radius: 10px; max-width: 500px; width: 90%;">
        <div style="text-align: right; margin-bottom: 10px;">
            <button onclick="closeDeezerPopup()" style="background: none; border: none; color: white; font-size: 24px; cursor: pointer;">×</button>
        </div>
        <iframe
            title="deezer-widget"
            src="https://widget.deezer.com/widget/auto/playlist/15506587361"
            width="100%"
            height="300"
            frameborder="0"
            allowtransparency="true"
            allow="encrypted-media; clipboard-write"
            style="border-radius: 8px;">
        </iframe>
    </div>

    <!-- Widget Deezer réduit en bas à droite -->
    <div style="position: fixed; bottom: 20px; right: 20px; z-index: 999;">
        <div
            onclick="openDeezerPopup()"
            style="cursor: pointer; width: 200px; height: 80px; background: rgba(0,0,0,0.7); border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: transform 0.3s;"
            onmouseover="this.style.transform='scale(1.05)'"
            onmouseout="this.style.transform='scale(1)'">
            <iframe
                title="deezer-widget-mini"
                src="https://widget.deezer.com/widget/auto/playlist/15506587361"
                width="200"
                height="80"
                frameborder="0"
                allowtransparency="true"
                allow="encrypted-media; clipboard-write"
                style="border-radius: 8px; background: transparent;">
            </iframe>
        </div>
    </div>

    <!-- Scripts pour les pop-ups -->
    <script>
        // Pop-up PCF 43
        function openPcfPopup() {
            document.getElementById('pcf-popup').style.display = 'block';
        }
        function closePcfPopup() {
            document.getElementById('pcf-popup').style.display = 'none';
        }

        // Pop-up Deezer
        function openDeezerPopup() {
            document.getElementById('deezer-popup').style.display = 'block';
        }
        function closeDeezerPopup() {
            document.getElementById('deezer-popup').style.display = 'none';
        }

        // Ferme les pop-ups si on clique en dehors
        window.onclick = function(event) {
            const pcfPopup = document.getElementById('pcf-popup');
            const deezerPopup = document.getElementById('deezer-popup');
            if (event.target === pcfPopup) {
                pcfPopup.style.display = 'none';
            }
            if (event.target === deezerPopup) {
                deezerPopup.style.display = 'none';
            }
        }
    </script>
</body>
</html>
