<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCF 43 - Accueil</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/tT0MFfbS/pcf43.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url("https://i.postimg.cc/k4rpWZCs/mezenc.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .logos {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
        }

        .logos a {
            display: block;
        }

        .logos img {
            height: 80px;
            transition: all 0.3s ease;
        }

        .logos a:first-child img {
            animation: bounce 2s infinite;
        }
        .logos a:first-child:hover img {
            animation: none;
            transform: scale(1.1);
        }

        .logos a:last-child img {
            transition: transform 0.5s ease;
        }
        .logos a:last-child:hover img {
            transform: rotate(15deg) scale(1.1);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin: 20px 0 40px;
        }

        .btn-urne {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
            gap: 12px;
            margin-bottom: 40px;
        }

        .btn-urne img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #d32f2f;
            background: rgba(0,0,0,0.45);
            padding: 10px;
            object-fit: contain;
            transition: transform 0.6s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .btn-urne:hover img {
            transform: rotate(360deg);
            box-shadow: 0 0 25px rgba(211,47,47,0.8);
        }

        .btn-urne span {
            font-size: 1.1em;
            background: #d32f2f;
            padding: 8px 22px;
            border-radius: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            transition: background 0.3s;
        }

        .btn-urne:hover span {
            background: #b71c1c;
        }

        .logos-bottom {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: auto;
        }

        .logos-bottom a {
            display: block;
        }

        .logos-bottom img {
            height: 70px;
            transition: all 0.3s ease;
        }

        .logos-bottom a:first-child:hover img {
            transform: scale(1.1) rotate(-10deg);
        }

        .logos-bottom a:last-child:hover img {
            transform: scale(1.1) rotate(10deg);
        }
    </style>
</head>
<body>
    <div class="logos">
        <a href="https://abonnement.humanite.fr/" target="_blank">
            <img src="https://i.postimg.cc/KjnNN342/l-umanite.png" alt="L'Humanité">
        </a>
        <a href="https://www.pcf.fr/" target="_blank">
            <img src="https://i.postimg.cc/7hgVVJbx/pcf.png" alt="PCF">
        </a>
    </div>
    <h1>Bienvenue sur le site du PCF 43</h1>
    <a href="analyse.html" class="btn-urne">
        <img src="https://i.postimg.cc/DZVM1DhN/urne.png" alt="Urne électorale">
        <span>Analyse Électorale →</span>
    </a>
    <div class="logos-bottom">
        <a href="https://groupe-communiste.assemblee-nationale.fr/" target="_blank">
            <img src="https://i.postimg.cc/QCpbbKVD/les-deputes.png" alt="Députés">
        </a>
        <a href="https://senateurscrce.fr/" target="_blank">
            <img src="https://i.postimg.cc/1XpHHV4P/Senateur.png" alt="Sénateur">
        </a>
    </div>
</body>
</html>
